name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 -I -m unittest discover -s tests
      - run: npm ci
      - run: npm test
      - name: Validate probes and checklists
        run: |
          bin/lcr validate-probes corpus/probes
          python3 -I scripts/check_checklists.py
      - name: Keep agent context small and timeless
        run: python3 -I scripts/lint_context.py
