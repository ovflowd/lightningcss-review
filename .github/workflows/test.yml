name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Dev tooling only (ESLint, Prettier, TypeScript for checkJs, the oracle's libraries for its
      # unit tests); the harness itself has no runtime dependencies.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Keep agent context small and timeless; checklists well-formed
        run: npm run lint:context
      - name: Validate curated probes
        run: npm run validate-probes
